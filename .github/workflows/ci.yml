name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# The repository is public, so every job runs on GitHub's hosted macOS runners, which are
# free for public repositories, and never on a runner on the owner's machine
# (docs/engineering.md, "Where CI runs"). On a pull request, the checkout is the change
# merged into master, so the checks run on what the merge would make.

jobs:
  # Format, lints, the scripts' checker, the suite through scripts/test.sh, which fails when a
  # run leaves anything behind, then scripts/hygiene.sh, which proves a killed run leaves
  # nothing after the next one.
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The whole history: tests/page.rs recounts the page's proof band at the commit it names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # rust-toolchain.toml names the version; with no argument rustup installs that one.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # GitHub's macOS image has no shellcheck. This installs the release the owner's Mac runs,
      # 0.11.0, and refuses it unless it matches the SHA-256 GitHub records for that file.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.gz
          echo "339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f  $RUNNER_TEMP/shellcheck.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh
      - run: scripts/test.sh
      - run: scripts/hygiene.sh

  # The project page against the brand: petals' check (colours, type, layout, surface, voice)
  # and the marks check, with petals and the brand from jahala/plotplot at the tag .petalsrc
  # pins. coldframe's own committed layer, .brand/products/coldframe/, is laid over the fetched
  # brand, so the check reads the layer this repository ships.
  page:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jahala/plotplot
          ref: 7fb34239dc5423f9f6cae1ff6ca39bb823711bd5 # v1.11.0, the version .petalsrc pins
          path: .plotplot
      - name: Fetch the brand and lay coldframe's layer over it
        run: |
          bash .plotplot/petals/scripts/fetch-brand.sh "$PWD/.plotplot" --target "$RUNNER_TEMP/brand"
          cp -R .brand/products/coldframe/. "$RUNNER_TEMP/brand/products/coldframe/"
      - run: bash .plotplot/petals/scripts/check.sh index.html --brand "$RUNNER_TEMP/brand" --product coldframe
      - run: python3 .plotplot/petals/scripts/marks.py --check --brand "$RUNNER_TEMP/brand"

  # The map lint, with tend2 built from jahala/tend at the commit the owner's installed tend2
  # runs (docs/decisions.md 8). jahala/tend is private, so the checkout reads it with a
  # read-only deploy key.
  map:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jahala/tend
          ref: 484ffdf0359bfd70b0420699e2f3770b4e9ccfbd
          ssh-key: ${{ secrets.TEND_DEPLOY_KEY }}
          path: .tend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build tend2
        run: npm ci && npm run build
        working-directory: .tend
      - run: node .tend/dist/cli.js lint --strict docs/tend2
