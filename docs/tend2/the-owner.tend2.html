# the owner: many projects, one Mac, and tests that should not cost money
**Who.** A person who builds many projects alone with agents, and runs their tests and CI on their own Mac to keep paid minutes near zero. Dozens of self-hosted runners share that Mac with the agents' own test runs, and the owner wants the machine to stay healthy without watching it.

It is the end of a month. CI has stopped twice because the paid minutes ran out. A heavy job sat in the queue for ten minutes, then waited another nineteen for a quiet machine, to run five minutes of tests. The disk is filling with logs that nothing removes.

## Jobs
- When CI runs on my Mac, I want the runners kept healthy and small without my attention, so the disk stops filling and a broken runner tells me before a job waits on it · from the CI review of 2026-10-29
- When many repositories' jobs land at once, I want the machine's load bounded as a whole, so heavy tests stop failing for want of ports and CPU · from the CI review of 2026-10-29
- When a project's tests run, here or in CI, I want them to leave nothing behind and to hold on a loaded machine, so I write that rule once instead of in every project · from the six separate designs found on 2026-10-30
- When I decide where a project's tests run, I want to know what CI costs and which workflows waste it, so paid minutes stay at zero · from the paid-minute stops of September and October 2026
- When I add a runner, I want to be stopped from putting it on a public repository, so a stranger's pull request never runs code on my Mac · from the ci-runner skill's rule on who can open a pull request
