# the self-hoster: GitHub's runners on their own Mac, to stop paying for minutes
**Who.** A developer outside the garden with a few private repositories, who moved their CI onto self-hosted runners on their own Mac when the free minutes ran out. They set the runners up once, from GitHub's instructions, and have not looked at them since.

Months later the disk is full. The runner folders hold gigabytes of logs and old runner versions, one runner went offline weeks ago without anyone noticing, and a job that used to take four minutes now waits ten for a free runner.

## Jobs
- When my runners have run for months, I want their old logs and versions cleared without breaking a running job, so the disk stops filling · guessed
- When a runner stops working, I want one command to tell me which and why, so a job does not sit waiting on it · guessed
- When I add a runner, I want to be stopped from putting it on a public repository, so a stranger's pull request never runs code on my Mac · guessed
