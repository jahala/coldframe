# adopt: every runner under coldframe's hooks, and none restarted while busy
**Goal.** `coldframe runner adopt` points every runner's completed hook at `coldframe hook completed`, which clears the job's checkout as the runners' `after-job.sh` does today, and restarts each runner only while it is idle, since a runner reads its `.env` only when it starts. A runner with no hook gets one. The hooks never call GitHub and never read a key.

## Tests
- [ ] (code) `hook completed` leaves the same tree as `after-job.sh` on identical copies of a dirty checkout, and touches nothing outside the runner's work folder · tests/hooks.rs
- [ ] (code) the hooks run with an empty home folder and a `gh` on the path that records any call, and neither is touched · tests/hooks.rs
- [ ] (code) on copied runner folders, adopt points every idle one's `.env` at coldframe's hooks and restarts it once, while a copy under a live process named `Runner.Worker` is not restarted and its `.env` is unchanged · tests/adopt.rs
- [ ] (human) after adopt on the owner's Mac, every runner's `.env` names coldframe's hooks, the one that had no hook included
