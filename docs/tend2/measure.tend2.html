# measure: the job timeline that every before-and-after claim stands on
**Goal.** `coldframe measure --since 14d` draws the CI job timeline per repository and for the whole machine, minute by minute: jobs queued against jobs running. It is the instrument for every claim the project loop makes, and its first answer decides whether a machine-wide cap is worth building: if CI ran above the cap (6 jobs, a third of the cores) in under 5 percent of busy minutes, the cap changes nothing and slots are not built.

## Tests
- [ ] (code) on the jobs recorded over the CI review's window, measure reproduces the review's hand count for the heaviest project's heavy jobs, about 10 minutes queued and up to 19 minutes waiting for a quiet machine, each within one minute · tests/measure.rs · reads: tests/fixtures/measure/
- [ ] (code) a minute with no job running is never counted busy, and a job queued across midnight is counted once, in both days' minutes · tests/measure.rs
- [ ] (human) the 14-day report, kept in the private notes repository, states the share of busy minutes above the cap, and the owner and plotplot read the slots decision from it
