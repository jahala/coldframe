# prune: each runner's files kept within their lifetimes
**Goal.** `coldframe prune` moves to the Trash runner logs older than 7 days, runner versions the runner no longer points to, and update leftovers, one idle runner at a time, and coldframe's own logs older than 30 days. It never touches a busy runner, never a file a runner did not make, and says what it moved and why. It records its outcome, and [status](status.tend2.html) turns red when the last prune failed or is older than 2 days.

## Tests
- [ ] (code) on a copy of a real runner folder, the dry-run lists exactly the logs dated older than 7 days, the superseded runner versions and the update leftovers, and leaves a file planted in its log folder and one planted beside the runner folder · tests/prune.rs · reads: tests/fixtures/runners/
- [ ] (code) prune moves to the Trash only what its dry-run listed, and skips a copied runner under a live process named `Runner.Worker` · tests/prune.rs
- [ ] (code) a prune broken on purpose turns status red, and a sound prune leaves it healthy · tests/prune.rs
- [ ] (human) run on every runner on the owner's Mac, each folder's measured size dropped by its dry-run prediction within 1 percent, while a copied folder prune did not run on kept its size; the record is in the notes repository
- [ ] (human) the owner states whether prune may delete runner-made files for good, or keeps moving them to the Trash, where they free no space until the Trash is emptied
