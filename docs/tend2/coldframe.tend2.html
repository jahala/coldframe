# coldframe: the bench where a change's tests run before it goes out
**Goal.** One tool owns how tests run on a self-hoster's Mac: the self-hosted runners there and the load they put on it, and test runs that leave nothing behind. The bet is proven first on the owner's Mac, and holds if, measured by [measure](measure.tend2.html) before and after, paid CI minutes stay at $0 a month, the slowest repository's heavy jobs wait less at the 90th percentile, runner disk stops growing week on week, and the projects' own "leave nothing behind" and "quiet machine" mechanisms come down to one, coldframe's. It is wrong if coldframe ends up larger than the scripts and mechanisms it replaced.

coldframe is one Rust binary, run by the runners' job hooks, by schedules the owner installs, and by hand; never a server, a daemon or a scheduler. The first milestone is six loops: [measure](measure.tend2.html) and [the started-hook spike](started-hook.tend2.html) decide whether a machine-wide cap is worth building; [status](status.tend2.html), [prune](prune.tend2.html) and [adopt](adopt.tend2.html) are the disk fix and the runners' health; [the run scope](run-scope.tend2.html) is "a run leaves nothing behind", written once. The pain they answer is on [the opportunity page](coldframe-opportunity.tend2.html).

## Tests
- [ ] (human) the goal above states the real bet, not a placeholder
- [ ] (code) the suite runs, counts at least one test, and fails when a run leaves a file behind · scripts/test.sh · reads: tests/, src/
- [ ] (code) the core page holds at most 150 lines, the instruction file imports it, and every path the core page, architecture, engineering and decision pages cite resolves · tests/references.rs · reads: AGENTS.md, CLAUDE.md, docs/architecture.md, docs/engineering.md, docs/decisions.md
- [ ] (code) no file this repository wrote carries an em dash, a placeholder or a skipped test · tests/hard_limits.rs
- [ ] (code) no file carries a path on the owner's machine or the name of one of their private projects · tests/public.rs
- [ ] (code) the project page shows a real run or an honest preview, true numbers, the brand's fonts and public links only · tests/page.rs · reads: index.html
- [ ] (human) on the owner's Mac, after adopt and prune, status reads healthy, every runner runs coldframe's hooks, and the runners' disk dropped by prune's prediction, recorded in the notes repository
